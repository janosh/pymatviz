name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
  workflow_call:

env:
  MPLBACKEND: Agg # non-interactive backend for matplotlib

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        split: [1, 2, 3, 4]
    uses: janosh/workflows/.github/workflows/pytest.yml@main
    secrets: inherit
    with:
      os: ${{ matrix.os }}
      python-version: '3.12'
      node-version: '24'
      # Widget tests run against a matterviz-anywidget bundle built from matterviz
      # main (not the npm release pinned in MATTERVIZ_ANYWIDGET_VERSION), so the
      # Python<->JS trait parity test catches drift before a matterviz release.
      # MATTERVIZ_ANYWIDGET_DIR makes fetch_widget_asset read that local build. Mirrors
      # matterviz/.github/actions/setup (strict-dep-builds=false: skipped lifecycle
      # scripts of registry deps are safe; --ignore-workspace: the anywidget package
      # depends on `matterviz: file:../..`, which needs dist/ from package:dist).
      pre-install-cmd: |
        git clone --depth 1 https://github.com/janosh/matterviz "$HOME/matterviz"
        # corepack pnpm from inside the clone honours matterviz's packageManager pin (the runner's pnpm is newer)
        corepack enable
        (cd "$HOME/matterviz" && MATTERVIZ_SKIP_PREPARE=1 corepack pnpm install --config.strict-dep-builds=false && corepack pnpm package:dist && corepack pnpm -C extensions/anywidget install --ignore-workspace --config.strict-dep-builds=false && corepack pnpm -C extensions/anywidget run build)
        echo "MATTERVIZ_ANYWIDGET_DIR=$HOME/matterviz/extensions/anywidget/build" >> "$GITHUB_ENV"
      # playwright + chromium so the headless export and JS prop parity tests run
      install-cmd: |
        uv pip install -e '.[test,brillouin,export]' --system
        playwright install --with-deps chromium
      # pytest-split distributes work load so parallel jobs finish in similar time
      # update durations file with `pytest --store-durations --durations-path tests/files/.pytest-split-durations`
      test-cmd: pytest --durations 20 --cov-branch --cov-report=xml --cov pymatviz --splits 4 --group ${{ matrix.split }} --splitting-algorithm least_duration
      # 'yes' uploads coverage but keeps CI green if Codecov errors (its GPG key
      # import from keybase flakes intermittently); 'strict' would fail the job
      upload-coverage: 'yes'

  run-widget-demos:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      # same matterviz-main bundle build as the tests job (see comment there)
      - name: Build matterviz-anywidget bundle from matterviz main
        run: |
          git clone --depth 1 https://github.com/janosh/matterviz "$HOME/matterviz"
          # corepack pnpm from inside the clone honours matterviz's packageManager pin (the runner's pnpm is newer)
          corepack enable
          (cd "$HOME/matterviz" && MATTERVIZ_SKIP_PREPARE=1 corepack pnpm install --config.strict-dep-builds=false && corepack pnpm package:dist && corepack pnpm -C extensions/anywidget install --ignore-workspace --config.strict-dep-builds=false && corepack pnpm -C extensions/anywidget run build)
          echo "MATTERVIZ_ANYWIDGET_DIR=$HOME/matterviz/extensions/anywidget/build" >> "$GITHUB_ENV"

      - name: Run all widget demos
        run: |
          uv pip install -e '.[test]' marimo nbconvert ipykernel --system
          python examples/widgets/vscode_interactive_demo.py
          marimo export script examples/widgets/marimo_demo.py -o /tmp/marimo_flat.py && python /tmp/marimo_flat.py
          jupyter nbconvert --to notebook --execute --ExecutePreprocessor.timeout=120 examples/widgets/jupyter_demo.ipynb --output /tmp/jupyter_out.ipynb

  find-example-scripts:
    runs-on: ubuntu-latest
    outputs:
      example_scripts: ${{ steps.set-matrix.outputs.example_scripts }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Find Python scripts
        id: set-matrix
        run: |
          SCRIPTS=$(find assets/scripts -name "*.py" | jq -R -s -c 'split("\n")[:-1]')
          echo "example_scripts=$SCRIPTS" >> $GITHUB_OUTPUT

  test-example-scripts:
    needs: find-example-scripts
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example_script: ${{fromJson(needs.find-example-scripts.outputs.example_scripts)}}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.12

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Run script
        run: uv run --with-editable .[make-assets] ${{ matrix.example_script }}
