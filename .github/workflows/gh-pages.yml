name: GitHub Pages

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    uses: janosh/workflows/.github/workflows/nodejs-gh-pages.yml@main
    with:
      node-version: 24
      # svelte-widgets comes from GitHub and builds on install: pnpm blocks dependency builds by
      # default, and its npm prepare step needs legacy peer resolution for the vite-plus alias
      install-cmd: corepack enable && NPM_CONFIG_LEGACY_PEER_DEPS=true pnpm install --config.dangerously-allow-all-builds=true
      python-version: "3.12"
      working-directory: site
      pre-build: |
        pip install -e '..[gh-pages]'
        python ../site/make_docs.py
